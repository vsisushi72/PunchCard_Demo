<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo - Punch Card</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-page">
 
  <button class="menu-toggle" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>
 
  <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>
 
  <nav class="side-menu" id="side-menu">
    <span>Usuario: <strong id="user-email">Cargando...</strong></span>
    <button onclick="logout()" class="btn-small">Cerrar Sesión</button>
  </nav>
 
  <main class="container">
    <h2>Tu Tarjeta de Sellos</h2>
    <p class="instructions">Haz clic en cualquier casilla para marcar/desmarcar un sello:</p>
 
    <img src="assets/deco-top.png" alt="" class="deco-full deco-top">
 
    <!-- Punch Card con 5 casillas -->
    <div class="punch-card">
      <div class="slot" onclick="toggleStamp(this)"></div>
      <div class="slot" onclick="toggleStamp(this)"></div>
      <div class="slot" onclick="toggleStamp(this)"></div>
      <div class="slot" onclick="toggleStamp(this)"></div>
      <div class="slot" onclick="toggleStamp(this)"></div>
    </div>
 
    <img src="assets/premios.png" alt="Premios" class="premios-img">
 
    <img src="assets/deco-bottom.png" alt="" class="deco-full deco-bottom">
  </main>
 
  <script>
    // ⚠️ REEMPLAZA CON TUS DATOS DE SUPABASE
    const SUPABASE_URL = 'https://jlhzxnfwazgaynlmwuaj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsaHp4bmZ3YXpnYXlubG13dWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NzkyMzgsImV4cCI6MjEwNTE1NTIzOH0.FssVyTalBQDh_veaBl5xQoZUwos2BqCRuqRyt7j9k10';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 
    // Verificar que el usuario inició sesión
    async function checkAuth() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('user-email').innerText = session.user.email;
      }
    }
    checkAuth();
 
    // Función para poner/quitar el sello
    function toggleStamp(element) {
      const stamped = element.classList.toggle('stamped');
      if (stamped) {
        const angle = (Math.random() * 50 - 25).toFixed(1);
        element.style.setProperty('--stamp-rotate', angle + 'deg');
      } else {
        element.style.removeProperty('--stamp-rotate');
      }
    }
 
    // Función para abrir/cerrar el menú lateral
    function toggleMenu() {
      document.getElementById('side-menu').classList.toggle('open');
      document.getElementById('menu-overlay').classList.toggle('open');
    }
 
    // Función de Cerrar Sesión
    async function logout() {
      await _supabase.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
